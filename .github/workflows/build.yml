name: Build Sapp APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Prepare Sapp project from bundle
        run: |
          python3 - <<'PY'
          import re
          import os
          import base64

          bundle = "bundle-4-Sapp-fixed.txt"

          if not os.path.exists(bundle):
              raise FileNotFoundError(f"{bundle} not found")

          t = open(bundle, encoding="utf-8").read()

          parts = re.split(
              r'^=====(FILE|B64) (.+?)=====\n',
              t,
              flags=re.M
          )

          if len(parts) < 4:
              raise RuntimeError(
                  "Bundle format is invalid or contains no project files."
              )

          for i in range(1, len(parts), 3):
              kind = parts[i]
              path = parts[i + 1]
              body = parts[i + 2]

              os.makedirs(
                  os.path.dirname(path) or ".",
                  exist_ok=True
              )

              if kind == "B64":
                  with open(path, "wb") as f:
                      f.write(base64.b64decode(body))
              else:
                  with open(path, "w", encoding="utf-8") as f:
                      f.write(body)

          print("Sapp project extracted successfully.")
          PY

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Accept Android SDK licenses
        run: |
          yes | sdkmanager --licenses > /dev/null || true

      - name: Build Sapp debug APK
        run: |
          gradle assembleDebug --stacktrace

      - name: Upload Sapp APK
        uses: actions/upload-artifact@v4
        with:
          name: Sapp-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
